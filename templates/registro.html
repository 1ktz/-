{% extends "base.html" %}{% block titulo %}Registro de alumno{% endblock %}{% block contenido %}<section class="tarjeta auth"><h1>Crear cuenta de alumno</h1><p>Tu nombre será tu usuario para los próximos ingresos.</p><form method="post"><label>Nombre</label><input name="nombre" required minlength="2" autocomplete="given-name"><label>Apellido</label><input name="apellido" required minlength="2" autocomplete="family-name"><label>Email</label><input type="email" name="email" required autocomplete="email"><label>Contraseña (mínimo 8 caracteres)</label><input type="password" name="password" required minlength="8" autocomplete="new-password"><button class="btn" type="submit">Registrarme</button></form><p>¿Ya tenés cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a></p></section>{% endblock %}
