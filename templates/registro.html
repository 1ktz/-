{% extends "base.html" %}{% block titulo %}Registro de alumno{% endblock %}{% block contenido %}<section class="tarjeta auth"><h1>Crear cuenta de alumno</h1><form method="post"><label>Nombre de usuario</label><input name="nombre_usuario" required minlength="2" autocomplete="username"><label>Nombre completo</label><input name="nombre_completo" required minlength="2" autocomplete="name"><label>Email</label><input type="email" name="email" required autocomplete="email"><label>Contraseña (mínimo 8 caracteres)</label><input type="password" name="password" required minlength="8" autocomplete="new-password"><button class="btn" type="submit">Registrarme</button></form><p>¿Ya tenés cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a></p></section>{% endblock %}
