{% extends "base.html" %}
{% block contenido %}
<section class="tarjeta">
  <h1>{{ titulo }}</h1>
  <form method="post" class="form">
    <label>Nombre
      <input name="nombre" value="{{ datos.get('nombre', '') }}" required minlength="2">
    </label>
    <label>Apellido
      <input name="apellido" value="{{ datos.get('apellido', '') }}" required minlength="2">
    </label>
    <label>Email
      <input type="email" name="email" value="{{ datos.get('email', '') }}" required>
    </label>
    <div class="acciones">
      <button class="btn" type="submit">Guardar</button>
      <a class="btn sec" href="{{ url_for('listar') }}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
