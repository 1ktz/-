{% extends "base.html" %}{% block titulo %}Iniciar sesión{% endblock %}{% block contenido %}<section class="tarjeta auth"><h1>Iniciar sesión</h1><p>Ingresá con tu nombre de usuario y contraseña.</p><form method="post"><label>Nombre de usuario</label><input name="nombre_usuario" required autocomplete="username"><label>Contraseña</label><input type="password" name="password" required autocomplete="current-password"><button class="btn" type="submit">Entrar</button></form><p>¿Sos alumno nuevo? <a href="{{ url_for('registro') }}">Crear cuenta</a></p></section>{% endblock %}
